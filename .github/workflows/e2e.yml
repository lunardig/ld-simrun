name: e2e

# Plays every storyboard against the live game in a headless browser, records both windows,
# and composes a 1080p MP4 per storyboard and one for the whole run (artifact clips-1080p).
# Run it by hand: Actions > e2e > Run workflow.
on:
  workflow_dispatch:
    inputs:
      pace:
        description: "fast, brisk or relaxed (relaxed for clips)"
        default: "relaxed"
      only:
        description: "storyboard ids, comma separated, or all"
        default: "all"
      voice:
        description: "captions: showcase or guide"
        default: "showcase"
      host:
        description: "the game"
        default: "https://lunardig.com"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: ffmpeg and fonts, for the 1080p clips
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - run: npm run build
      - run: npm run e2e
        env:
          HOST_URL: ${{ inputs.host }}
          PACE: ${{ inputs.pace }}
          ONLY: ${{ inputs.only }}
          VOICE: ${{ inputs.voice }}
          VIDEO_DIR: recordings
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-1080p
          path: recordings/clips
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raw-windows
          path: recordings/*.webm
